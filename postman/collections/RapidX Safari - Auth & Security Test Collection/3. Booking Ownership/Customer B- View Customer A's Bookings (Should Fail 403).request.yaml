$kind: http-request
name: "Customer B: View Customer A's Bookings (Should Fail 403)"
url: "{{base_url}}/user-bookings/{{customer_a_id}}"
method: GET
headers:
  Authorization: Bearer {{customer_b_token}}
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Customer B blocked from viewing Customer A bookings (403 Forbidden)', function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 2000
