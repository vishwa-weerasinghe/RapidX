$kind: http-request
url: "{{base_url}}/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
        "Email": "customera@example.com",
        "Password": "WrongPassword@999"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('SEC-01: Wrong password returns 401 Unauthorized', function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 5000
